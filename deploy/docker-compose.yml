# From the repo root:
#
#   docker compose -f deploy/docker-compose.yml run --rm record    # record runs
#   docker compose -f deploy/docker-compose.yml run --rm replay    # replay, no network
#
#   docker compose -f deploy/docker-compose.yml run --rm bench-record   # 200 runs, both systems
#   docker compose -f deploy/docker-compose.yml run --rm bench-replay   # replay them, no network
#
# `replay` runs with network_mode: none, so it can only succeed if every call
# is answered from the event log.

name: ledger

x-worker: &worker
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: ledger-worker:dev
  volumes:
    - ledger-data:/data
  environment:
    LEDGER_DB: /data/ledger.db
    OPENAI_BASE_URL: http://fakellm:8787/v1
    OPENAI_API_KEY: fake
    TOOLS_URL: http://fakellm:8787/tools
    LEDGER_MODEL: fake-model

services:
  fakellm:
    image: ledger-worker:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "ledger.testing.fake_llm", "--host", "0.0.0.0", "--port", "8787"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/healthz')"]
      interval: 2s
      retries: 15

  record:
    <<: *worker
    command: ["python", "-m", "ledger.examples.toy_pipeline", "record", "--runs", "5"]
    depends_on:
      fakellm:
        condition: service_healthy
    profiles: ["jobs"]

  replay:
    <<: *worker
    network_mode: none
    command: ["ledger", "replay", "--all", "-g", "ledger.examples.toy_pipeline:graph_from_env"]
    profiles: ["jobs"]

  # Replay-fidelity benchmark (bench/replay_fidelity.py), in two phases so
  # the replay runs in a container with no network at all.
  bench-record:
    <<: *worker
    command: ["python", "-m", "bench.replay_fidelity", "record", "--data", "/data/bench", "--fresh"]
    depends_on:
      fakellm:
        condition: service_healthy
    profiles: ["jobs"]

  bench-replay:
    <<: *worker
    network_mode: none
    volumes:
      - ledger-data:/data
      - ../bench/results:/app/bench/results
    command:
      ["python", "-m", "bench.replay_fidelity", "replay", "--data", "/data/bench",
       "--require-offline", "fakellm:8787"]
    profiles: ["jobs"]

volumes:
  ledger-data:

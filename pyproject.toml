[project]
name = "ledger-runtime"
version = "0.0.1"
description = "A runtime under LangGraph that makes agent runs replayable, crash-safe and self-diagnosing."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=0.6",
    "openai>=1.40",
    "protobuf>=7.35",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "grpcio-tools>=1.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]

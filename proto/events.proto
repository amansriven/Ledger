// Ledger event log schema.
//
// Shared by the Python runtime, the Go trace server and the UI. Every
// intercepted call becomes one Event appended to a run's log.
//
// Payloads (requests, responses, tool args and results) are carried as
// canonical JSON, not as nested protobuf messages. Protobuf serialization is
// not canonical, so hashing proto bytes would give different digests for the
// same logical value. Canonical JSON (sorted keys, no whitespace, UTF-8) is
// hashed with SHA-256 instead, and that digest is what replay matches on.

syntax = "proto3";

package ledger.v1;

import "google/protobuf/timestamp.proto";

// Where in the graph a call happened. Stable across record and replay, so a
// replayed call finds its recording by key rather than by global log order.
// Parallel branches therefore never take each other's recorded responses.
message StepRef {
  // Parent graph namespaces with task ids stripped, joined by "|".
  // Empty for the top-level graph.
  string namespace = 1;
  // LangGraph superstep number.
  int64 superstep = 2;
  // Node name.
  string node = 3;
  // LangGraph task path, rendered as a string (stable across runs).
  string path = 4;
  // Position of this call among the intercepted calls made by the same task.
  int64 seq = 5;
}

// A JSON value in canonical form plus its SHA-256 digest (lowercase hex).
// Payloads above the store's size threshold live in a content-addressed blob
// store keyed by the same digest; the stored event then has `json` empty, and
// readers get it back filled in.
message Payload {
  string sha256 = 1;
  bytes json = 2;
}

message Error {
  // Exception class, e.g. "openai.APIConnectionError".
  string type = 1;
  string message = 2;
  // The exception's args, as a JSON list, when they serialize. Replay
  // rebuilds the exception from its class and these args, so code that
  // catches it sees the same type and str() as when it was recorded.
  Payload args = 3;
}

enum Mode {
  MODE_UNSPECIFIED = 0;
  MODE_RECORD = 1;
  MODE_REPLAY = 2;
  // A replay that edits the outcome of chosen calls, or reruns them live,
  // and runs everything downstream of them live (ledger.fork).
  MODE_FORK = 3;
}

message RunStarted {
  Mode mode = 1;
  Payload input = 2;
  // Run this one replays, when mode is MODE_REPLAY or MODE_FORK.
  string source_run_id = 3;
  // The graph that ran, as "module:attr", when the ledger CLI started the
  // run. Lets `ledger replay` and `ledger fork` find it again. Empty for
  // runs started from Python.
  string graph = 4;
}

message RunFinished {
  Payload output = 1;
  Error error = 2;
}

message LLMCall {
  // OpenAI-compatible endpoint the client points at.
  string base_url = 1;
  // "chat.completions.create" for now.
  string operation = 2;
  string model = 3;
  Payload request = 4;
  Payload response = 5;
  Error error = 6;
  int64 latency_us = 7;
  // SHA-256 of the normalized request (volatile timestamps and ids masked,
  // transport-only keys dropped). Replay matches on this. Empty in M0 logs,
  // which match on request.sha256 instead.
  string request_key = 8;
}

message ToolCall {
  string name = 1;
  // {"args": [...], "kwargs": {...}}
  Payload args = 2;
  Payload result = 3;
  Error error = 4;
  int64 latency_us = 5;
  // SHA-256 of the normalized args; see LLMCall.request_key.
  string args_key = 6;
}

// A nondeterministic value read through ledger.now(), ledger.time(),
// ledger.uuid4() or ledger.rng(). Recorded live, served from the log on replay.
message Nondet {
  // "time", "uuid4" or "rng_seed".
  string source = 1;
  Payload value = 2;
}

enum DivergenceReason {
  DIVERGENCE_REASON_UNSPECIFIED = 0;
  // The recording has a call of the same kind at this step, with a
  // different request.
  DIVERGENCE_REASON_CHANGED_REQUEST = 1;
  // The recording has no call at this step.
  DIVERGENCE_REASON_UNRECORDED_CALL = 2;
  // The recording has a different kind of call at this step (say, a tool
  // call where the replay made an LLM call).
  DIVERGENCE_REASON_CHANGED_KIND = 3;
  // A fork replaced the recorded outcome of this call with an edited one.
  // The call event that follows carries the edited outcome.
  DIVERGENCE_REASON_EDITED = 4;
  // A fork asked for this call to run live again instead of replaying.
  DIVERGENCE_REASON_RERUN = 5;
}

// A replay stopped following the recording at this step: either it made a
// call that does not match (with on_divergence="live"), or a fork edited or
// reran the call. Every call downstream of it ran live. Logged in the
// replay's run at the step, just before the call's own event.
message Diverged {
  DivergenceReason reason = 1;
  // Body kind of the call the replay made: "llm_call", "tool_call", "nondet".
  string kind = 2;
  // Match key (or kind, for CHANGED_KIND) the recording has at this step.
  // Empty for UNRECORDED_CALL.
  string recorded = 3;
  // Match key (or kind) of the call the replay made.
  string actual = 4;
}

message Event {
  string run_id = 1;
  // Position in the run's log, starting at 0, with no gaps.
  int64 index = 2;
  google.protobuf.Timestamp recorded_at = 3;
  // Unset for run-level events.
  StepRef step = 4;
  // True for a call a replay answered from the recording; false for a call
  // that went live. (Replay logs written before this field existed have it
  // false on every call.)
  bool from_log = 5;

  oneof body {
    RunStarted run_started = 10;
    RunFinished run_finished = 11;
    LLMCall llm_call = 12;
    ToolCall tool_call = 13;
    Nondet nondet = 14;
    Diverged diverged = 15;
  }
}
